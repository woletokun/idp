apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: scraper-alerts
  namespace: monitoring
spec:
  groups:
  - name: scraper-job-alerts
    rules:
    - alert: ScraperJobFailures
      expr: scraper_jobs_failed_total > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        description: "Scraper job failed in the last 5 minutes"
    - alert: ScraperJobSlow
      expr: scraper_job_duration_seconds > 300
      for: 5m
      labels:
        severity: critical
      annotations:
        description: "Scraper job running longer than 5 minutes"
