apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adminer
  namespace: apps
  annotations:
    kubernetes.io/ingress.class: traefik   # or traefik, depending on your ingress controller
spec:
  rules:
  - host: adminer.mycluster.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: adminer
            port:
              number: 8080
