name: CI/CD with ArgoCD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r apps/linkedin-scraper/requirements.txt

    - name: Run tests
      run: pytest apps/linkedin-scraper/tests/ || echo "No tests found"

    - name: Build Docker image
      run: docker build -t ghcr.io/woletokun/idp:latest apps/linkedin-scraper/

    - name: Push Docker image
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        docker push ghcr.io/woletokun/idp:latest
